[project]
name = "vidlens"
version = "0.1.0"
description = "Agent-friendly video parsing CLI (Douyin/Bilibili first): metadata, subtitles/ASR, frame extraction, context bundles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.6.9",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "pillow>=10.0",
    "sherpa-onnx>=1.10.30",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
vidlens = "vidlens.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
ignore = [
    "E501",  # long lines: hint/message strings are intentionally verbose
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
